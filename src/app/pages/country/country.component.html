<section class="olympic-layout" aria-labelledby="country-page-title">
  <h1 id="country-page-title" class="page-title" tabindex="0">{{ titlePage ? 'Olympic results for ' + titlePage : 'Country details' }}</h1>
  <app-page-feedback
    [state]="state"
    [indicatorCount]="3"
    [successMessage]="'Loaded Olympic results for ' + titlePage + '.'"
  />
  @if (state.status === 'success' || (state.status === 'empty' && titlePage)) {
    <app-header
      [title]="titlePage"
      [indicators]="[
        { label: 'Number of entries', value: totalEntries },
        { label: 'Total Number of medals', value: totalMedals },
        { label: 'Total Number of athletes', value: totalAthletes }
      ]"
    />
  }
    <figure class="chart-panel" [hidden]="state.status !== 'success'">
      @if (state.status === 'success') {
      @defer (on viewport; prefetch on idle) {
        <app-olympic-chart
          type="line"
          [labels]="summary().years"
          [values]="summary().medals"
          dataDescriptionId="participation-description"
        />
      } @placeholder {
        <div class="chart-placeholder" aria-hidden="true"></div>
      } @loading {
        <div class="chart-placeholder" role="status">Loading chart...</div>
      } @error {
        <p class="page-message" role="alert">Unable to load the chart. Please reload the page.</p>
      }
      <p id="participation-description" class="visually-hidden">
        {{ titlePage }}: medals and athletes by Olympic year.
        @for (participation of summary().participations; track participation.id) {
          {{ participation.year }}, {{ participation.city }}:
          {{ participation.medalsCount }} medals, {{ participation.athleteCount }} athletes.
        }
      </p>
      }
      <figcaption class="chart-caption">Olympic year</figcaption>
    </figure>
</section>
