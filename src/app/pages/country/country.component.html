@let page = state();
<section class="olympic-page olympic-page--country" aria-labelledby="country-page-title">
  <div class="olympic-page__heading">
    <h1 id="country-page-title" class="page-title olympic-page__title" tabindex="0">
      Olympic results
    </h1>
  </div>
  <app-page-feedback
    [state]="page"
    [showSkeleton]="false"
    [indicatorCount]="3"
    [successMessage]="
      page.status === 'success' || page.status === 'empty'
        ? 'Loaded Olympic results for ' + page.data.summary.name + '.'
        : ''
    "
  />
  @if (page.status === 'loading') {
    <div class="country-picker">
      <span class="country-picker__flag" aria-hidden="true"></span>
      <button class="country-picker__trigger" type="button" disabled>Loading country...</button>
      <svg class="country-picker__chevron" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" />
      </svg>
    </div>
    <app-header
      variant="country"
      title="Country statistics"
      [loading]="true"
      [indicators]="loadingIndicators"
    />
    <figure class="chart-card chart-card--history" aria-labelledby="country-chart-title">
      <header class="chart-card__heading">
        <span class="chart-card__icon" aria-hidden="true"
          ><svg class="chart-card__icon-image" viewBox="0 0 40 40">
            <path fill="#38a8f2" d="M18 3a17 17 0 1 0 17 17H18Z" />
            <path fill="#83cbff" d="M21 2v15h15A16 16 0 0 0 21 2Z" />
            <path fill="none" stroke="white" stroke-width="1.5" d="m18 20 12 12" /></svg
        ></span>
        <div>
          <h2 id="country-chart-title" class="chart-card__title">Medals over time</h2>
          <p class="chart-card__description">Total number of medals won</p>
        </div>
      </header>

      <div class="chart-placeholder" aria-hidden="true"></div>
      <figcaption class="chart-card__caption">Olympic year</figcaption>
    </figure>
  }
  @if (page.status === 'success' || page.status === 'empty') {
    @let vm = page.data;
    <div class="country-picker">
      <button
        class="country-picker__trigger"
        type="button"
        popovertarget="country-options"
        aria-label="Country"
        [class.country-picker__trigger--long]="vm.summary.name.length > 10"
      >
        <span
          [class]="
            'country-picker__flag' + (vm.flagCode ? ' country-picker__flag--' + vm.flagCode : '')
          "
          aria-hidden="true"
        ></span>
        <span class="country-picker__name">{{ vm.summary.name }}</span>
        <svg class="country-picker__chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
      </button>
      <div class="country-picker__dropdown" id="country-options" popover>
        <ul class="country-picker__list" aria-label="Countries">
          @for (country of vm.options; track country.id) {
            @if (country.id !== vm.summary.id) {
              <li class="country-picker__item">
                <button
                  class="country-picker__option"
                  type="button"
                  popovertarget="country-options"
                  popovertargetaction="hide"
                  (click)="changeCountry('' + country.id)"
                >
                  <span
                    [class]="
                      'country-picker__flag' +
                      (country.flagCode ? ' country-picker__flag--' + country.flagCode : '')
                    "
                    aria-hidden="true"
                  ></span>
                  <span class="country-picker__name">{{ country.name }}</span>
                </button>
              </li>
            }
          }
        </ul>
      </div>
    </div>
    <app-header variant="country" [title]="vm.summary.name" [indicators]="vm.indicators" />
    @if (page.status === 'success') {
      <figure class="chart-card chart-card--history" aria-labelledby="country-chart-title">
        <header class="chart-card__heading">
          <span class="chart-card__icon" aria-hidden="true"
            ><svg class="chart-card__icon-image" viewBox="0 0 40 40">
              <path fill="#38a8f2" d="M18 3a17 17 0 1 0 17 17H18Z" />
              <path fill="#83cbff" d="M21 2v15h15A16 16 0 0 0 21 2Z" />
              <path fill="none" stroke="white" stroke-width="1.5" d="m18 20 12 12" /></svg
          ></span>
          <div>
            <h2 id="country-chart-title" class="chart-card__title">Medals over time</h2>
            <p class="chart-card__description">
              Total number of medals won{{ vm.summary.name ? ' by ' + vm.summary.name : '' }}
            </p>
          </div>
        </header>

        @defer (on viewport; on idle; prefetch on idle) {
          <app-olympic-chart
            type="line"
            [items]="vm.chartItems"
            dataDescriptionId="participation-description"
          />
        } @placeholder {
          <div class="chart-placeholder" aria-hidden="true"></div>
        } @loading {
          <div class="chart-placeholder" role="status">Loading chart...</div>
        } @error {
          <p class="page-message" role="alert">Unable to load the chart. Please reload the page.</p>
        }
        <p id="participation-description" class="visually-hidden">
          {{ vm.summary.name }}: medals and athletes by Olympic year.
          @for (participation of vm.summary.participations; track participation.id) {
            {{ participation.year }}, {{ participation.city }}:
            {{ participation.medalsCount }} medals, {{ participation.athleteCount }} athletes.
          }
        </p>
        <figcaption class="chart-card__caption">Olympic year</figcaption>
      </figure>
    }
  }
</section>
