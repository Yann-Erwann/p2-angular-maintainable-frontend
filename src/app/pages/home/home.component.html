<h2>Olympic games app</h2>
<hr/>
@if (state.status === 'loading') {
  <p role="status">Loading Olympic data...</p>
} @else if (state.status === 'error') {
  <p role="alert">{{ state.message }}</p>
  <a routerLink="/">Go back to home</a>
} @else if (state.status === 'empty') {
  <p role="status">No Olympic data available.</p>
} @else if (state.status === 'success') {
  <app-header
    [title]="titlePage"
    [indicators]="[
      { label: 'Number of countries', value: totalCountries },
      { label: 'Number of JOs', value: totalJOs }
    ]"
  />
  <app-olympic-chart
    type="pie"
    [labels]="summary().countries"
    [values]="summary().medals"
    (countrySelected)="selectCountry($event)"
  />
}
