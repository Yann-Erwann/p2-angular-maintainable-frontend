@let page = state();
<section class="olympic-page olympic-page--home" aria-labelledby="home-page-title">
  <h1 id="home-page-title" class="page-title olympic-page__title" tabindex="0">
    Olympic games app
  </h1>
  <p class="olympic-page__intro">Explore and compare Olympic medals across countries</p>
  <app-page-feedback
    [state]="page"
    [showSkeleton]="false"
    [successMessage]="
      page.status === 'success'
        ? 'Loaded medal totals for ' + page.data.rows.length + ' countries.'
        : ''
    "
  />
  @if (page.status === 'success' || page.status === 'loading') {
    <app-header
      variant="dashboard"
      [loading]="page.status === 'loading'"
      title="Medals per Country"
      [indicators]="page.status === 'success' ? page.data.indicators : loadingIndicators"
    />
    <figure class="chart-card chart-card--medals" aria-labelledby="medals-chart-title">
      <header class="chart-card__heading">
        <span class="chart-card__icon" aria-hidden="true"
          ><svg class="chart-card__icon-image" viewBox="0 0 40 40">
            <path fill="#38a8f2" d="M18 3a17 17 0 1 0 17 17H18Z" />
            <path fill="#83cbff" d="M21 2v15h15A16 16 0 0 0 21 2Z" />
            <path fill="none" stroke="white" stroke-width="1.5" d="m18 20 12 12" /></svg
        ></span>
        <div>
          <h2 id="medals-chart-title" class="chart-card__title">Medals per Country</h2>
          <p class="chart-card__description">Distribution of medals won by country</p>
        </div>
      </header>
      @if (page.status === 'success') {
        @let vm = page.data;
        <div class="chart-card__body">
          @defer (on viewport; prefetch on idle) {
            <app-olympic-chart
              type="pie"
              [items]="vm.chartItems"
              dataDescriptionId="country-medals-description"
              (pointSelected)="selectCountry($event)"
            />
          } @placeholder {
            <div class="chart-placeholder" aria-hidden="true"></div>
          } @loading {
            <div class="chart-placeholder" role="status">Loading chart...</div>
          } @error {
            <p class="page-message" role="alert">
              Unable to load the chart. Please reload the page.
            </p>
          }
          <div class="medal-table">
            <table class="medal-table__table">
              <caption class="visually-hidden">
                Medal totals and share by country
              </caption>
              <thead class="medal-table__head">
                <tr class="medal-table__row">
                  <th
                    class="medal-table__cell medal-table__cell--header medal-table__cell--country"
                    scope="col"
                  >
                    Country
                  </th>
                  <th
                    class="medal-table__cell medal-table__cell--header medal-table__cell--medals"
                    scope="col"
                  >
                    Medals
                  </th>
                  <th
                    class="medal-table__cell medal-table__cell--header medal-table__cell--percentage"
                    scope="col"
                  >
                    Percentage
                  </th>
                </tr>
              </thead>
              <tbody class="medal-table__body">
                @for (country of vm.rows; track country.id) {
                  <tr class="medal-table__row" [style.--medal-color]="country.color">
                    <th class="medal-table__cell medal-table__cell--country" scope="row">
                      <a
                        class="medal-table__country-link"
                        [routerLink]="['/country', country.id]"
                        [attr.aria-describedby]="
                          'country-medals-' + country.id + ' country-percentage-' + country.id
                        "
                        ><span class="medal-table__dot" aria-hidden="true"></span
                        >{{ country.name }}</a
                      >
                    </th>
                    <td
                      class="medal-table__cell medal-table__cell--medals"
                      [id]="'country-medals-' + country.id"
                    >
                      {{ country.medals }}<span class="visually-hidden"> medals</span>
                    </td>
                    <td
                      class="medal-table__cell medal-table__cell--percentage"
                      [id]="'country-percentage-' + country.id"
                    >
                      <span class="medal-table__percentage"
                        ><span class="medal-table__track" aria-hidden="true"
                          ><span
                            class="medal-table__fill"
                            [style.width.%]="country.percentage"
                          ></span></span
                        ><span class="medal-table__share"
                          >{{ country.percentage }}%<span class="visually-hidden">
                            of total</span
                          ></span
                        ></span
                      >
                    </td>
                  </tr>
                }
              </tbody>
            </table>
          </div>
        </div>
        <figcaption id="country-medals-description" class="visually-hidden">
          Total medals by country.
          @for (country of vm.rows; track country.id) {
            {{ country.name }}: {{ country.medals }} medals.
          }
        </figcaption>
      } @else {
        <div class="chart-card__body">
          <div class="chart-placeholder" aria-hidden="true"></div>
          <div class="table-placeholder" aria-hidden="true"></div>
        </div>
      }
    </figure>
  }
</section>
