<header class="results-header__heading">
  <h2
    [attr.data-page-heading]="variant() === 'dashboard' ? '' : null"
    class="results-header__title"
    [attr.tabindex]="variant() === 'country' ? null : 0"
  >
    @if (variant() === 'dashboard') {
      <svg class="results-header__heading-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M3 13h4v8H3zm7-10h4v18h-4zm7 7h4v11h-4z" />
      </svg>
    }
    {{ title() }}
  </h2>
</header>
<div class="results-header__indicators">
  @for (indicator of indicators(); track indicator.kind) {
    <dl
      class="results-header__indicator"
      [class.results-header__indicator--medals]="indicator.kind === 'medals'"
      [class.results-header__indicator--athletes]="indicator.kind === 'athletes'"
      [attr.data-kind]="indicator.kind"
      tabindex="0"
      [attr.aria-label]="indicator.label + ': ' + (loading() ? 'Loading' : indicator.value)"
    >
      @if (variant() !== 'standard') {
        <span
          class="results-header__icon"
          [class.results-header__icon--editions]="indicator.kind === 'editions'"
          aria-hidden="true"
        >
          @if (variant() === 'country') {
            <svg class="results-header__icon-image" viewBox="0 0 48 48" fill="currentColor">
              @switch (indicator.kind) {
                @case ('entries') {
                  <circle cx="24" cy="14" r="7" />
                  <circle cx="9" cy="18" r="5" />
                  <circle cx="39" cy="18" r="5" />
                  <path
                    d="M13 39v-9a11 11 0 0 1 22 0v9ZM2 36v-8a7 7 0 0 1 10-6l-3 14Zm37 0-3-14a7 7 0 0 1 10 6v8Z"
                  />
                }
                @case ('medals') {
                  <path d="m8 4 8-2 8 17-8 4Zm32 0-8-2-8 17 8 4Z" />
                  <circle cx="24" cy="33" r="12" />
                  <path
                    fill="white"
                    d="m24 25 2.4 5 5.6.8-4 4 1 5.5-5-2.6-5 2.6 1-5.5-4-4 5.6-.8Z"
                  />
                }
                @case ('athletes') {
                  <circle cx="32" cy="8" r="5" />
                  <path
                    d="m25 15 9 4 8-1 1 5-10 2-8-4-5 8 10 4-5 13-5-2 3-8-12-5 8-13-5 1-7 8-4-3 9-11 8-2Zm-9 17 4 4-8 9H2v-5h8Z"
                  />
                }
              }
            </svg>
          } @else if (indicator.kind === 'countries') {
            <svg
              class="results-header__icon-image"
              viewBox="0 0 48 48"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
            >
              <circle cx="24" cy="24" r="19" />
              <ellipse cx="24" cy="24" rx="9" ry="19" />
              <path d="M5 24h38M24 5v38" />
            </svg>
          } @else {
            <svg
              class="results-header__icon-image"
              viewBox="0 0 48 48"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
            >
              <path fill="currentColor" stroke="none" d="M26 2c7 14-12 14-4 24-17-8-2-16 4-24Z" />
              <path d="M16 29c5 4 12 4 17 0M19 34l5 12 5-12M12 25c5 4 20 8 23 0" />
            </svg>
          }
        </span>
        <svg
          class="results-header__decoration"
          viewBox="0 0 160 80"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
        >
          @if (variant() === 'country') {
            @if (indicator.kind === 'medals') {
              <path d="M60 8C20 25 20 60 60 74M100 8c40 17 40 52 0 66" />
              <path
                fill="currentColor"
                stroke="none"
                d="m35 15 15 8-4 15-14-8Zm-12 25 17 3 3 15-17-2Zm11 26 17-6 10 11-17 7Zm91-51-15 8 4 15 14-8Zm12 25-17 3-3 15 17-2Zm-11 26-17-6-10 11 17 7Z"
              />
            } @else if (indicator.kind === 'athletes') {
              <g fill="currentColor" stroke="none">
                <circle cx="85" cy="14" r="10" />
                <path
                  d="m69 28 21 8 18-2 2 9-23 4-16-7-10 14 20 9-13 17-10-4 10-11-23-9 16-26-12 1-14 16-8-6 18-23 18-2Zm-26 29 9 9-17 14H14V69h17Z"
                />
              </g>
            } @else {
              <circle cx="80" cy="20" r="13" />
              <circle cx="42" cy="30" r="10" />
              <circle cx="118" cy="30" r="10" />
              <path
                fill="currentColor"
                stroke="none"
                d="M54 76V60a26 26 0 0 1 52 0v16ZM20 70V56a19 19 0 0 1 29-16l-4 30Zm95 0-4-30a19 19 0 0 1 29 16v14Z"
              />
            }
          } @else if (indicator.kind === 'editions') {
            <circle cx="34" cy="30" r="22" />
            <circle cx="80" cy="30" r="22" />
            <circle cx="126" cy="30" r="22" />
            <circle cx="57" cy="54" r="22" />
            <circle cx="103" cy="54" r="22" />
          } @else {
            <path
              fill="currentColor"
              stroke="none"
              d="m8 16 24-8 12 8 20-2-4 18-16 9-5 18-12-19-12-5zm44 26 12 4 8 16-6 16-8-8zm34-28 30-8 18 9 19 1-3 14-22 5-13-6-9 9-5 20-12-11-11-10zm36 41 21-4 10 13-17 6-16-6z"
            />
          }
        </svg>
      }
      <dt class="results-header__label">{{ indicator.label }}</dt>
      <dd class="results-header__value">{{ loading() ? '—' : indicator.value }}</dd>
    </dl>
  }
</div>
