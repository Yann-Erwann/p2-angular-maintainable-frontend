<header class="center">
  <h2 tabindex="0">
    @if (variant() === 'dashboard') { <svg class="heading-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 13h4v8H3zm7-10h4v18h-4zm7 7h4v11h-4z"/></svg> }
    {{ title() }}
  </h2>
</header>
<div class="split">
  @for (indicator of indicators(); track $index) {
    <dl tabindex="0" [attr.aria-label]="indicator.label + ': ' + (loading() ? 'Loading' : indicator.value)">
      @if (variant() === 'dashboard') {
        <span class="indicator-icon" [class.editions-icon]="$index === 1" aria-hidden="true">
          @if ($index === 0) { <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3"><circle cx="24" cy="24" r="19"/><ellipse cx="24" cy="24" rx="9" ry="19"/><path d="M5 24h38M24 5v38"/></svg> }
          @else { <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3"><path fill="currentColor" stroke="none" d="M26 2c7 14-12 14-4 24-17-8-2-16 4-24Z"/><path d="M16 29c5 4 12 4 17 0M19 34l5 12 5-12M12 25c5 4 20 8 23 0"/></svg> }
        </span>
        <svg class="indicator-decoration" viewBox="0 0 160 80" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3">
          @if ($index === 1) { <circle cx="34" cy="30" r="22"/><circle cx="80" cy="30" r="22"/><circle cx="126" cy="30" r="22"/><circle cx="57" cy="54" r="22"/><circle cx="103" cy="54" r="22"/> }
          @else { <path fill="currentColor" stroke="none" d="m8 16 24-8 12 8 20-2-4 18-16 9-5 18-12-19-12-5zm44 26 12 4 8 16-6 16-8-8zm34-28 30-8 18 9 19 1-3 14-22 5-13-6-9 9-5 20-12-11-11-10zm36 41 21-4 10 13-17 6-16-6z"/> }
        </svg>
      }
      <dt>{{ indicator.label }}</dt>
      <dd>{{ loading() ? '—' : indicator.value }}</dd>
    </dl>
  }
</div>
