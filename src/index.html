<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Olympic Games App</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore Olympic medal totals by country, participation history and athlete statistics."
    />
    <meta name="application-name" content="Olympic Games App" />
    <meta name="theme-color" content="#0b6470" />
    <link rel="preload" href="assets/mock/olympic.json" as="fetch" crossorigin="anonymous" />
    <script>
      // Preload the same responsive banner that the initial route will display.
      const bannerPath = location.hash.slice(1).split(/[?#]/)[0];
      const homeBanner = !bannerPath || bannerPath === '/' || bannerPath.startsWith('/country/');
      const compactBanner = !homeBanner || matchMedia('(max-width: 600px)').matches;
      const bannerPreload = document.createElement('link');
      bannerPreload.rel = 'preload';
      bannerPreload.as = 'image';
      bannerPreload.type = 'image/webp';
      bannerPreload.fetchPriority = 'high';
      bannerPreload.href = compactBanner
        ? 'assets/images/teleSport.webp'
        : 'assets/images/teleSport-home.webp';
      bannerPreload.imageSrcset = compactBanner
        ? 'assets/images/teleSport-small.webp 438w, assets/images/teleSport.webp 874w'
        : 'assets/images/teleSport-home-small.webp 670w, assets/images/teleSport-home.webp 1339w';
      let bannerSizes = '(min-width: 1500px) 1428px, calc(100vw - 72px)';
      if (compactBanner) {
        bannerSizes = 'calc(100vw - 32px)';
        if (!homeBanner) {
          bannerSizes = '(min-width: 544px) 512px, calc(100vw - 32px)';
        }
      }
      bannerPreload.imageSizes = bannerSizes;
      document.head.appendChild(bannerPreload);
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Olympic Games App" />
    <meta
      property="og:description"
      content="Explore Olympic medal totals by country, participation history and athlete statistics."
    />
    <meta property="og:site_name" content="Olympic Games App" />
    <link
      rel="icon"
      type="image/x-icon"

  <body>
    <app-root class="home-dashboard">
      <header class="brand-header">
        <nav aria-label="Main navigation">
          <a class="brand-link" href="./" aria-label="Home — TéléSport">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="assets/images/teleSport-small.webp 438w, assets/images/teleSport.webp 874w"
                sizes="calc(100vw - 32px)"
              />
              <img
                class="brand-banner"
                src="assets/images/teleSport-home.webp"
                srcset="
                  assets/images/teleSport-home-small.webp  670w,
                  assets/images/teleSport-home.webp       1339w
                "
                sizes="(min-width: 1500px) 1428px, calc(100vw - 72px)"
                width="1339"
                height="211"
                alt="TéléSport — Olympic games app. Explore and compare Olympic medals across countries."
                loading="eager"
                fetchpriority="high"
              />
            </picture>
          </a>
        </nav>
      </header>
      <h1 class="page-title">Olympic Games App</h1>
      <output class="page-message">Loading Olympic Games...</output>
      <noscript><p class="page-message">Enable JavaScript to explore Olympic results.</p></noscript>
    </app-root>
    <script>
      // Match the hash route before Angular starts to keep the banner layout stable.
      const initialPath = location.hash.slice(1).split(/[?#]/)[0];
      if (initialPath && initialPath !== '/' && !initialPath.startsWith('/country/')) {
        const root = document.querySelector('app-root');
        const banner = root.querySelector('.brand-banner');
        root.classList.remove('home-dashboard');
        root.querySelector('source').remove();
        banner.src = 'assets/images/teleSport.webp';
        banner.srcset =
          'assets/images/teleSport-small.webp 438w, assets/images/teleSport.webp 874w';
        banner.sizes = '(min-width: 544px) 512px, calc(100vw - 32px)';
        banner.width = 874;
        banner.height = 251;
        banner.alt = 'TéléSport — Olympic Games';
      }
    </script>
  </body>
</html>
