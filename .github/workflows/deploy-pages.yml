name: Validate, deploy and verify Angular

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_lighthouse:
        description: Run three Lighthouse audits per route and profile
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: angular-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          version: 12.10.1
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test --watch=false

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          version: 12.10.1
          runtime: node@24
          cache: true
          install: false

      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate documentation
        run: pnpm run docs

      - name: Upload documentation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: documentation/
          if-no-files-found: ignore
          retention-days: 14

  build:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          version: 12.10.1
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production artifact
        run: |
          pnpm run build --configuration production --base-href /
          printf '/*\n  ! Link\n' > dist/olympic-games-starter/browser/_headers

      - name: Check Cloudflare Pages artifact
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const site = 'dist/olympic-games-starter/browser';
          const index = join(site, 'index.html');
          if (!existsSync(index)) throw new Error(`Missing ${index}`);
          if (existsSync(join(site, '404.html'))) {
            throw new Error('Remove root 404.html from the published SPA artifact');
          }
          const html = readFileSync(index, 'utf8');
          if (!/<base\b[^>]*\bhref=["']\/["']/i.test(html)) {
            throw new Error('Angular base href must be / for Cloudflare Pages');
          }
          const sources = [...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/gi)]
            .map((match) => match[1])
            .filter((src) => !/^(https?:)?\/\//i.test(src) && /\.m?js(?:[?#]|$)/i.test(src));
          if (sources.length === 0) throw new Error('No local JavaScript entrypoints in index.html');
          for (const src of sources) {
            const relativePath = decodeURIComponent(new URL(src, 'https://local.invalid/').pathname.slice(1));
            if (!existsSync(join(site, relativePath))) {
              throw new Error(`Missing JavaScript entrypoint: ${relativePath}`);
            }
          }
          console.log(`Validated ${sources.length} local JavaScript entrypoint(s)`);
          NODE

      - name: Prepare local E2E artifact
        run: |
          site=dist/olympic-games-starter
          rm -rf "$site/e2e"
          cp -a "$site/browser" "$site/e2e"

      - name: Playwright browser tests
        run: pnpm exec playwright test --project=chromium
        env:
          E2E_USE_EXISTING_BUILD: 'true'

      - name: Upload validated site
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: angular-production-site
          path: dist/olympic-games-starter/browser/
          if-no-files-found: error
          retention-days: 7

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: [quality, docs, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cloudflare-pages
      url: 'https://p2-angular-maintainable-frontend.pages.dev/'
    outputs:
      page_url: 'https://p2-angular-maintainable-frontend.pages.dev/'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm and Node for deployment
        uses: pnpm/setup@v3
        with:
          version: 12.10.1
          runtime: node@24
          cache: true
          install: false

      - name: Download validated site
        uses: actions/download-artifact@v8
        with:
          name: angular-production-site
          path: dist/olympic-games-starter/browser

      - name: Verify deployment artifact
        run: test -f dist/olympic-games-starter/browser/index.html

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: '4.149.0'
          command: pages deploy dist/olympic-games-starter/browser --project-name=p2-angular-maintainable-frontend --branch=main --commit-hash=${{ github.sha }}

      - name: Verify published JavaScript MIME types
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          site=dist/olympic-games-starter/browser
          count=0
          while IFS= read -r -d '' file; do
            relative=${file#"$site"/}
            result=$(curl --silent --show-error --location --retry 3 \
              --output /dev/null --write-out '%{http_code} %{content_type}' \
              "${DEPLOYMENT_URL%/}/$relative")
            read -r status mime <<< "$result"
            if [[ "$status" != '200' || ! "$mime" =~ (java|ecma)script ]]; then
              echo "::error::Invalid response for $relative: HTTP $status, MIME $mime"
              exit 1
            fi
            count=$((count + 1))
          done < <(find "$site" -type f -name '*.js' -print0)
          if (( count == 0 )); then
            echo '::error::No JavaScript files found in deployment artifact'
            exit 1
          fi
          echo "Verified $count published JavaScript files"

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          version: 12.10.1
          runtime: node@24
          cache: true
          install: false

      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deployed pages and data
        run: pnpm exec playwright test e2e/verify-deployment.spec.ts --project=chromium
        env:
          PRODUCTION_SERVER_URL: ${{ needs.deploy.outputs.page_url }}

      - name: Prepare deployed Lighthouse routes
        id: lighthouse_routes
        if: always()
        env:
          PRODUCTION_SERVER_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          const base = process.env.PRODUCTION_SERVER_URL.endsWith('/')
            ? process.env.PRODUCTION_SERVER_URL
            : `${process.env.PRODUCTION_SERVER_URL}/`;
          const response = await fetch(new URL('assets/mock/olympic.json', base));
          if (!response.ok) throw new Error(`Unable to load deployed Olympic data: ${response.status}`);
          const countries = await response.json();
          if (!Array.isArray(countries) || countries.some((country) => !Number.isSafeInteger(country?.id))) {
            throw new Error('Deployed Olympic data does not expose valid country identifiers.');
          }
          console.log(`LIGHTHOUSE_COUNTRY_IDS=${countries.map((country) => country.id).join(',')}`);
          NODE

      - name: Lighthouse 98 on deployed Cloudflare Pages
        if: always() && steps.lighthouse_routes.outcome == 'success'
        run: pnpm exec playwright test e2e/lighthouse.spec.ts --project=lighthouse
        env:
          PRODUCTION_SERVER_URL: ${{ needs.deploy.outputs.page_url }}
          LIGHTHOUSE_RUNS: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_lighthouse) && '3' || '1' }}

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
