name: Validate and deploy Angular

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      measure_performance:
        description: Measure Lighthouse performance on the validated build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: angular-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@12.10.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check formatting
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test --watch=false
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Generate documentation
        run: pnpm run docs
      - name: Build production artifact
        run: pnpm run build:e2e
      - name: Write release manifest
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          const output = 'dist/olympic-games-starter';
          const html = await readFile(`${output}/browser/index.html`, 'utf8');
          await writeFile(`${output}/browser/release.json`, JSON.stringify({
            revision: process.env.RELEASE_REVISION,
            indexSha256: createHash('sha256').update(html).digest('hex'),
          }) + '\n');
          NODE
      - name: Test production pages and optionally measure Lighthouse
        env:
          PRODUCTION_SERVER_URL: http://127.0.0.1:4187/p2-angular-maintainable-frontend/
          MEASURE_PERFORMANCE: ${{ github.event_name == 'workflow_dispatch' && inputs.measure_performance }}
        run: |
          node <<'SERVER' &
          const { createServer } = require('node:http');
            const { readFile, stat } = require('node:fs/promises');
            const { resolve, extname, sep } = require('node:path');
            const root = resolve('dist/olympic-games-starter/browser');
            const prefix = '/p2-angular-maintainable-frontend/';
            const mime = { '.html': 'text/html', '.js': 'text/javascript', '.css': 'text/css',
              '.json': 'application/json', '.webp': 'image/webp', '.txt': 'text/plain',
              '.ico': 'image/x-icon', '.svg': 'image/svg+xml' };
            const server = createServer(async (request, response) => {
              try {
                const pathname = decodeURIComponent(new URL(request.url, 'http://localhost').pathname);
                if (!pathname.startsWith(prefix)) { response.writeHead(404).end(); return; }
                const file = resolve(root, pathname.slice(prefix.length) || 'index.html');
                if (!file.startsWith(root + sep)) { response.writeHead(403).end(); return; }
                if (!(await stat(file)).isFile()) { response.writeHead(404).end(); return; }
                response.writeHead(200, { 'Content-Type': mime[extname(file)] || 'application/octet-stream',
                  'Cache-Control': 'no-cache' });
                response.end(await readFile(file));
              } catch { response.writeHead(404).end(); }
            });
            server.listen(4187, '127.0.0.1');
            for (const signal of ['SIGINT', 'SIGTERM']) process.on(signal, () => server.close());
          SERVER
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node --input-type=module <<'READY'
          const url = process.env.PRODUCTION_SERVER_URL;
          const deadline = Date.now() + 15_000;
          while (true) {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(1000) });
              if (response.ok) break;
            } catch {}
            if (Date.now() >= deadline) throw new Error('Production server failed to start.');
            await new Promise(resolve => setTimeout(resolve, 100));
          }
          READY
          pnpm run test:e2e
          if [ "$MEASURE_PERFORMANCE" = true ]; then
            node --input-type=module <<'LIGHTHOUSE'
          import { chromium } from '@playwright/test';
          import lighthouse from 'lighthouse';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';

          const base = process.env.PRODUCTION_SERVER_URL;
          const output = resolve('validation-artifacts/performance');
          await mkdir(output, { recursive: true });
          // Lighthouse connects to an explicit Linux/browser process, including under WSL.
          const browser = await chromium.launch({
            executablePath: process.env.PLAYWRIGHT_CHROMIUM_EXECUTABLE,
            args: ['--remote-debugging-port=9225'],
          });
          try {
            for (const [name, route] of [
              ['home', '#/'],
              ['france', '#/country/5'],
            ]) {
              for (let run = 1; run <= 3; run++) {
                const result = await lighthouse(new URL(route, base).href, {
                  port: 9225,
                  onlyCategories: ['performance'],
                  output: 'json',
                  logLevel: 'error',
                });
                if (!result || result.lhr.runtimeError) throw new Error(`Lighthouse failed for ${name}`);
                await writeFile(
                  resolve(output, `${name}-${run}.report.json`),
                  JSON.stringify(result.lhr, null, 2),
                );
                console.log(`Measured ${name} (${run}/3)`);
              }
            }
          } finally {
            await browser.close();
          }
          LIGHTHOUSE
          fi
      - name: Upload validated site
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/olympic-games-starter/browser
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            playwright-report/
            test-results/
            documentation/
            validation-artifacts/performance/
          retention-days: 14

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout smoke check
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm for browser smoke check
        run: npm install --global pnpm@12.10.1
      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile
      - name: Install verification browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed pages and data
        run: |
          node --input-type=module <<'VERIFY'
          import { createHash } from 'node:crypto';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { chromium, expect } from '@playwright/test';

          if (!process.env.DEPLOYMENT_URL || !process.env.EXPECTED_REVISION) {
            throw new Error('DEPLOYMENT_URL and EXPECTED_REVISION are required.');
          }
          const base = new URL(process.env.DEPLOYMENT_URL.endsWith('/')
            ? process.env.DEPLOYMENT_URL : process.env.DEPLOYMENT_URL + '/');
          const output = 'test-results/deployment';
          await mkdir(output, { recursive: true });
          const failures = [];
          let browser;
          let context;
          let page;
          async function getResource(route, type) {
            const response = await fetch(new URL(route, base), {
              cache: 'no-store', signal: AbortSignal.timeout(15_000),
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.url}`);
            if (!response.headers.get('content-type')?.includes(type)) {
              throw new Error(`Unexpected content type: ${response.url}`);
            }
            return response;
          }
          try {
            const html = await (await getResource('', 'text/html')).text();
            if (!html.includes('<app-root') || !html.includes('type="module"')) {
              throw new Error('Missing Angular bootstrap.');
            }
            const release = await (await getResource('release.json', 'application/json')).json();
            if (release.revision !== process.env.EXPECTED_REVISION) {
              throw new Error(`Wrong deployed revision: ${release.revision}`);
            }
            if (release.indexSha256 !== createHash('sha256').update(html).digest('hex')) {
              throw new Error('The HTML must match the validated release.');
            }
            const countries = await (await getResource('assets/mock/olympic.json', 'application/json')).json();
            const france = Array.isArray(countries) && countries.find(country => country.id === 5);
            if (france?.country !== 'France' || !france.participations?.length) {
              throw new Error('Missing France and its participations.');
            }
            browser = await chromium.launch({ executablePath: process.env.PLAYWRIGHT_CHROMIUM_EXECUTABLE });
            context = await browser.newContext();
            await context.tracing.start({ screenshots: true, snapshots: true, sources: true });
            page = await context.newPage();
            page.setDefaultTimeout(15_000);
            page.setDefaultNavigationTimeout(30_000);
            page.on('pageerror', error => failures.push(`JavaScript: ${error.message}`));
            page.on('console', message => {
              if (message.type() === 'error') failures.push(`Console: ${message.text()}`);
            });
            page.on('response', response => {
              if (response.status() >= 400) failures.push(`HTTP ${response.status()}: ${response.url()}`);
            });
            page.on('requestfailed', request => {
              if (request.failure()?.errorText !== 'net::ERR_ABORTED') {
                failures.push(`Network: ${request.url()} (${request.failure()?.errorText})`);
              }
            });
            await page.goto(new URL('#/', base).href);
            await expect(page).toHaveTitle('Medals by country | Olympic Games', { timeout: 15_000 });
            await expect(page.locator('canvas')).toBeVisible({ timeout: 15_000 });
            await page.getByRole('link', { name: 'France', exact: true }).click();
            await expect(page).toHaveTitle('France | Olympic Games', { timeout: 15_000 });
            await expect(page.locator('canvas')).toBeVisible({ timeout: 15_000 });
            await page.goto(new URL('#/country/5', base).href);
            await page.reload();
            await expect(page).toHaveTitle('France | Olympic Games', { timeout: 15_000 });
            await expect(page.locator('app-header dd')).toHaveText(['3', '113', '1238']);
            await expect(page.locator('canvas')).toBeVisible({ timeout: 15_000 });
            await page.getByRole('link', { name: 'Home — TéléSport', exact: true }).click();
            await expect(page).toHaveTitle('Medals by country | Olympic Games', { timeout: 15_000 });
            await expect(page.locator('canvas')).toBeVisible({ timeout: 15_000 });
            if (failures.length) throw new Error(failures.join('\n'));
            console.log('OK revision, HTML, data, home, France reload and return home');
          } catch (error) {
            if (page) await page.screenshot({ path: `${output}/failure.png`, fullPage: true }).catch(() => {});
            await writeFile(`${output}/failure.json`, JSON.stringify({ error: String(error), failures }, null, 2));
            throw error;
          } finally {
            if (context) await context.tracing.stop({ path: `${output}/trace.zip` }).catch(() => {});
            if (browser) await browser.close();
          }
          VERIFY
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ github.sha }}
      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
