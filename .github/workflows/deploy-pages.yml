name: Validate and deploy Angular

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angular-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@12.10.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test --watch=false
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Generate documentation
        run: pnpm run docs
      - name: Build production artifact
        run: pnpm run build:e2e
      - name: Prepare static routes and release manifest
        id: prepare
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: node .github/scripts/prepare-release.mjs
      - name: Lighthouse mobile — require 100 in every category
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .github/lighthouse/mobile.cjs
      - name: Save mobile Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14
      - name: Lighthouse desktop — require 100 in every category
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .github/lighthouse/desktop.cjs
      - name: Save desktop Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-desktop
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14
      - name: Upload validated site
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/olympic-games-starter/browser
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            documentation/
          retention-days: 14

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout smoke check
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm for browser smoke check
        run: npm install --global pnpm@12.10.1
      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile
      - name: Install verification browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed pages and data
        run: node .github/scripts/verify-deployment.mjs
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ github.sha }}
      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
