name: Validate, deploy and verify Angular

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_lighthouse:
        description: Run three Lighthouse audits per route and profile
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: read

concurrency:
  group: angular-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          version: 12.10.1
          runtime: node@24
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test --watch=false

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          version: 12.10.1
          runtime: node@24
          cache: true
          install: false
      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate documentation
        run: pnpm run docs

      - name: Upload documentation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: documentation/
          if-no-files-found: ignore
          retention-days: 14

  build:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          version: 12.10.1
          runtime: node@24
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build production artifact
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm run build --configuration production --base-href "${BASE_PATH%/}/"
      - name: Prepare SPA fallback
        run: cp dist/olympic-games-starter/browser/index.html dist/olympic-games-starter/browser/404.html
      - name: Prepare local E2E artifact
        run: |
          rm -rf dist/olympic-games-starter/e2e
          cp -a dist/olympic-games-starter/browser dist/olympic-games-starter/e2e
          sed -i -E 's#<base href="[^"]*"[^>]*>#<base href="/">#' \
            dist/olympic-games-starter/e2e/index.html
      - name: Playwright browser tests
        run: pnpm exec playwright test --project=chromium
        env:
          E2E_USE_EXISTING_BUILD: 'true'
      - name: Prepare GitHub Pages route entries
        run: |
          site=dist/olympic-games-starter/browser
          while read -r country_id; do
            mkdir -p "$site/country/$country_id"
            cp "$site/index.html" "$site/country/$country_id/index.html"
          done < <(node -e "for (const country of JSON.parse(require('fs').readFileSync('src/assets/mock/olympic.json', 'utf8'))) console.log(country.id)")
          mkdir -p "$site/not-found"
          cp "$site/index.html" "$site/not-found/index.html"
      - name: Upload validated site
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/olympic-games-starter/browser
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: [quality, docs, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          version: 12.10.1
          runtime: node@24
          cache: true
          install: false
      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify deployed pages and data
        run: pnpm exec playwright test e2e/verify-deployment.spec.ts --project=chromium
        env:
          PRODUCTION_SERVER_URL: ${{ needs.deploy.outputs.page_url }}
      - name: Prepare deployed Lighthouse routes
        id: lighthouse_routes
        if: always()
        env:
          PRODUCTION_SERVER_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          const base = process.env.PRODUCTION_SERVER_URL.endsWith('/')
            ? process.env.PRODUCTION_SERVER_URL
            : `${process.env.PRODUCTION_SERVER_URL}/`;
          const response = await fetch(new URL('assets/mock/olympic.json', base));
          if (!response.ok) throw new Error(`Unable to load deployed Olympic data: ${response.status}`);
          const countries = await response.json();
          if (!Array.isArray(countries) || countries.some((country) => !Number.isSafeInteger(country?.id))) {
            throw new Error('Deployed Olympic data does not expose valid country identifiers.');
          }
          console.log(`LIGHTHOUSE_COUNTRY_IDS=${countries.map((country) => country.id).join(',')}`);
          NODE
      - name: Lighthouse 80 on deployed Pages
        if: always() && steps.lighthouse_routes.outcome == 'success'
        run: pnpm exec playwright test e2e/lighthouse.spec.ts --project=lighthouse
        env:
          PRODUCTION_SERVER_URL: ${{ needs.deploy.outputs.page_url }}
          LIGHTHOUSE_RUNS: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_lighthouse) && '3' || '1' }}
      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
