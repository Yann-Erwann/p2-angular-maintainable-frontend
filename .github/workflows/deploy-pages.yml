name: Validate, deploy and verify Angular

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_lighthouse:
        description: Run three Lighthouse audits per route and profile
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: angular-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: 12.10.1
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test --watch=false

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: 12.10.1
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate documentation
        run: pnpm run docs

      - name: Upload documentation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: documentation
          path: documentation/
          if-no-files-found: ignore
          retention-days: 14

  build:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: 12.10.1
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production artifact
        run: |
          pnpm run build --configuration production --base-href / --deploy-url /
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const site = 'dist/olympic-games-starter/browser';
          const nonce = randomBytes(16).toString('base64');
          for (const fileName of ['index.html', '_headers']) {
            const filePath = join(site, fileName);
            const content = readFileSync(filePath, 'utf8');
            const replaced = content.replaceAll('__CSP_NONCE__', nonce);
            if (replaced === content || replaced.includes('__CSP_NONCE__')) {
              throw new Error(`CSP nonce placeholder missing or unresolved in ${fileName}`);
            }
            writeFileSync(filePath, replaced);
          }
          NODE

      - name: Check Cloudflare Pages artifact
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const site = 'dist/olympic-games-starter/browser';
          const index = join(site, 'index.html');
          const headers = join(site, '_headers');
          if (!existsSync(index)) throw new Error(`Missing ${index}`);
          if (!existsSync(headers)) throw new Error(`Missing ${headers}`);
          if (existsSync(join(site, '404.html'))) {
            throw new Error('Remove root 404.html from the published SPA artifact');
          }
          const html = readFileSync(index, 'utf8');
          const nonce = html.match(/\bngcspnonce=["']([^"']+)["']/i)?.[1];
          if (!nonce || !/^[A-Za-z0-9+/]{22}==$/.test(nonce)) {
            throw new Error('Production HTML must contain a generated CSP nonce');
          }
          const headerText = readFileSync(headers, 'utf8');
          const headerLines = headerText.split(/\r?\n/).filter((line) => line.trim());
          if (headerLines.shift()?.trim() !== '/*') throw new Error('Invalid Cloudflare _headers rule');
          const responseHeaders = new Map();
          for (const line of headerLines) {
            const match = line.match(/^\s{2}([A-Za-z-]+):\s*(.+)$/);
            if (!match) throw new Error(`Invalid Cloudflare header rule: ${line}`);
            if (responseHeaders.has(match[1])) throw new Error(`Duplicate response header: ${match[1]}`);
            responseHeaders.set(match[1], match[2]);
          }
          const expectedHeaders = new Map([
            [
              'Content-Security-Policy',
              `default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'nonce-${nonce}'; style-src 'self' 'nonce-${nonce}'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; form-action 'self'`,
            ],
            ['X-Content-Type-Options', 'nosniff'],
            ['X-Frame-Options', 'DENY'],
            ['Referrer-Policy', 'strict-origin-when-cross-origin'],
            ['Permissions-Policy', 'camera=(), microphone=(), geolocation=(), payment=(), usb=()'],
          ]);
          if (responseHeaders.size !== expectedHeaders.size) {
            throw new Error('Cloudflare _headers contains an unexpected response header set');
          }
          for (const [name, value] of expectedHeaders) {
            if (responseHeaders.get(name) !== value) throw new Error(`Invalid security header: ${name}`);
          }
          if (/unsafe-(?:inline|eval)/.test(responseHeaders.get('Content-Security-Policy'))) {
            throw new Error('CSP must not allow unsafe inline code or eval');
          }
          if (!/<base\b[^>]*\bhref=["']\/["']/i.test(html)) {
            throw new Error('Angular base href must be / for Cloudflare Pages');
          }
          const modulePreloads = [...html.matchAll(/<link\b[^>]*>/gi)]
            .map((match) => match[0])
            .filter((tag) => /\brel=["']modulepreload["']/i.test(tag))
            .map((tag) => tag.match(/\bhref=["']([^"']+)["']/i)?.[1])
            .filter((src) => src !== undefined);
          if (modulePreloads.some((src) => !src.startsWith('/'))) {
            throw new Error('Modulepreload URLs must be absolute from the Cloudflare Pages root');
          }
          const sources = [...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/gi)]
            .map((match) => match[1])
            .filter((src) => !/^(https?:)?\/\//i.test(src) && /\.m?js(?:[?#]|$)/i.test(src));
          const assetSources = [...new Set([...sources, ...modulePreloads])];
          if (assetSources.length === 0) throw new Error('No local JavaScript entrypoints in index.html');
          for (const src of assetSources) {
            const relativePath = decodeURIComponent(new URL(src, 'https://local.invalid/').pathname.slice(1));
            if (!existsSync(join(site, relativePath))) {
              throw new Error(`Missing JavaScript entrypoint: ${relativePath}`);
            }
          }
          console.log(`Validated ${assetSources.length} local JavaScript asset reference(s)`);
          NODE

      - name: Prepare local E2E artifact
        run: |
          site=dist/olympic-games-starter
          rm -rf "$site/e2e"
          cp -a "$site/browser" "$site/e2e"

      - name: Playwright browser tests
        run: pnpm exec playwright test --project=chromium
        env:
          E2E_USE_EXISTING_BUILD: 'true'

      - name: Upload validated site
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: angular-production-site
          path: dist/olympic-games-starter/browser/
          if-no-files-found: error
          retention-days: 7

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: [quality, docs, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cloudflare-pages
      url: 'https://p2-angular-maintainable-frontend.pages.dev/'
    outputs:
      page_url: 'https://p2-angular-maintainable-frontend.pages.dev/'
      deployment_url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm and Node for deployment
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: 12.10.1
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Download validated site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: angular-production-site
          path: dist/olympic-games-starter/browser

      - name: Verify deployment artifact
        run: |
          test -f dist/olympic-games-starter/browser/index.html
          test -f dist/olympic-games-starter/browser/_headers
          ! grep -q '__CSP_NONCE__' dist/olympic-games-starter/browser/index.html
          ! grep -q '__CSP_NONCE__' dist/olympic-games-starter/browser/_headers

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: '4.149.0'
          command: pages deploy dist/olympic-games-starter/browser --project-name=p2-angular-maintainable-frontend --branch=main --commit-hash=${{ github.sha }}

      - name: Verify published JavaScript MIME types
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          site=dist/olympic-games-starter/browser
          count=0
          while IFS= read -r -d '' file; do
            relative=${file#"$site"/}
            result=$(curl --silent --show-error --location --retry 3 \
              --output /dev/null --write-out '%{http_code} %{content_type}' \
              "${DEPLOYMENT_URL%/}/$relative")
            read -r status mime <<< "$result"
            if [[ "$status" != '200' || ! "$mime" =~ (java|ecma)script ]]; then
              echo "::error::Invalid response for $relative: HTTP $status, MIME $mime"
              exit 1
            fi
            count=$((count + 1))
          done < <(find "$site" -type f -name '*.js' -print0)
          if (( count == 0 )); then
            echo '::error::No JavaScript files found in deployment artifact'
            exit 1
          fi
          echo "Verified $count published JavaScript files"

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: 12.10.1
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deployed pages and data
        run: pnpm exec playwright test e2e/verify-deployment.spec.ts --project=chromium
        env:
          PRODUCTION_SERVER_URL: ${{ needs.deploy.outputs.page_url }}

      - name: Prepare deployed Lighthouse routes
        id: lighthouse_routes
        if: always()
        env:
          PRODUCTION_SERVER_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          const base = process.env.PRODUCTION_SERVER_URL.endsWith('/')
            ? process.env.PRODUCTION_SERVER_URL
            : `${process.env.PRODUCTION_SERVER_URL}/`;
          const response = await fetch(new URL('assets/mock/olympic.json', base));
          if (!response.ok) throw new Error(`Unable to load deployed Olympic data: ${response.status}`);
          const countries = await response.json();
          if (!Array.isArray(countries) || countries.some((country) => !Number.isSafeInteger(country?.id))) {
            throw new Error('Deployed Olympic data does not expose valid country identifiers.');
          }
          console.log(`LIGHTHOUSE_COUNTRY_IDS=${countries.map((country) => country.id).join(',')}`);
          NODE

      - name: Lighthouse 98 on deployed Cloudflare Pages
        if: always() && steps.lighthouse_routes.outcome == 'success'
        run: pnpm exec playwright test e2e/lighthouse.spec.ts --project=lighthouse
        env:
          PRODUCTION_SERVER_URL: ${{ needs.deploy.outputs.page_url }}
          LIGHTHOUSE_RUNS: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_lighthouse) && '3' || '1' }}

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deployment-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
