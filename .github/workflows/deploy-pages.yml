name: Validate and deploy Angular

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      measure_performance:
        description: Measure Lighthouse performance on the validated build
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: angular-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@12.10.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check formatting
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test --watch=false
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Generate documentation
        run: pnpm run docs
      - name: Build production artifact
        run: pnpm run build:e2e
      - name: Write release manifest
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: node .github/scripts/prepare-release.mjs
      - name: Test production pages and measure Lighthouse
        env:
          PRODUCTION_SERVER_URL: http://127.0.0.1:4187/p2-angular-maintainable-frontend/
          MEASURE_PERFORMANCE: ${{ github.event_name != 'workflow_dispatch' || inputs.measure_performance }}
        run: |
          node .github/scripts/serve-production.mjs &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node .github/scripts/wait-for-server.mjs
          pnpm run test:e2e
          if [ "$MEASURE_PERFORMANCE" = true ]; then
            echo 'Starting Lighthouse: three audits per page (home and France).'
            node --input-type=module <<'LIGHTHOUSE'
          import { chromium } from '@playwright/test';
          import lighthouse from 'lighthouse';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';

          const base = process.env.PRODUCTION_SERVER_URL;
          const output = resolve('validation-artifacts/performance');
          await mkdir(output, { recursive: true });
          // Lighthouse connects to an explicit Linux/browser process, including under WSL.
          const browser = await chromium.launch({
            executablePath: process.env.PLAYWRIGHT_CHROMIUM_EXECUTABLE,
            args: ['--remote-debugging-port=9225'],
          });
          try {
            for (const [name, route] of [
              ['home', './'],
              ['france', 'country/5'],
            ]) {
              for (let run = 1; run <= 3; run++) {
                const result = await lighthouse(new URL(route, base).href, {
                  port: 9225,
                  onlyCategories: ['performance'],
                  output: 'json',
                  logLevel: 'error',
                });
                if (!result || result.lhr.runtimeError) throw new Error(`Lighthouse failed for ${name}`);
                await writeFile(
                  resolve(output, `${name}-${run}.report.json`),
                  JSON.stringify(result.lhr, null, 2),
                );
                console.log(`Measured ${name} (${run}/3)`);
              }
            }
          } finally {
            await browser.close();
          }
          LIGHTHOUSE
          else
            echo 'Lighthouse disabled for this manual run (measure_performance=false).'
          fi
      - name: Upload validated site
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/olympic-games-starter/browser
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            playwright-report/
            test-results/
            documentation/
            validation-artifacts/performance/
          retention-days: 14

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout smoke check
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm for browser smoke check
        run: npm install --global pnpm@12.10.1
      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile
      - name: Install verification browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed pages and data
        run: node .github/scripts/verify-deployment.mjs
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ github.sha }}
      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
