// Karma configuration file
// https://karma-runner.github.io/6.4/config/configuration-file.html
// Resolve an installed browser once, without requiring CHROME_BIN in the shell.

const runtime = require('node:process');
const fs = require('node:fs');
const path = require('node:path');

if (!runtime.env.CHROME_BIN) {
  const browser = [
    '/usr/bin/google-chrome',
    '/usr/bin/chromium',
    '/usr/bin/chromium-browser',
  ].find(browserPath => fs.existsSync(browserPath));

  if (browser) {
    runtime.env.CHROME_BIN = browser;
  }
}

const isRoot = runtime.getuid?.() === 0;

module.exports = function (config) {
  config.set({
    basePath: '',

    frameworks: [
      'jasmine',
      '@angular-devkit/build-angular',
    ],

    plugins: [
      require('karma-jasmine'),
      require('karma-chrome-launcher'),
      require('karma-jasmine-html-reporter'),
      require('karma-coverage'),
      require('@angular-devkit/build-angular/plugins/karma'),
    ],

    client: {
      jasmine: {},
      clearContext: false,
    },

    jasmineHtmlReporter: {
      suppressAll: true,
    },

    coverageReporter: {
      dir: path.join(__dirname, './coverage/olympic-games-starter'),
      subdir: '.',
      reporters: [
        { type: 'html' },
        { type: 'text-summary' },
      ],
    },

    reporters: [
      'progress',
      'kjhtml',
    ],

    port: 9876,
    colors: true,
    logLevel: config.LOG_INFO,
    autoWatch: true,

    customLaunchers: {
      ChromeHeadlessRoot: {
        base: 'ChromeHeadless',
        flags: ['--no-sandbox'],
      },
    },

    browsers: [
      isRoot ? 'ChromeHeadlessRoot' : 'ChromeHeadless',
    ],

    singleRun: false,
    restartOnFileChange: true,
  });
};